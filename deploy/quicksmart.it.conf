upstream quicksmart_app {
    server 127.0.0.1:3010;
    keepalive 32;
}

server {
    server_name quicksmart.it www.quicksmart.it;
    listen 80;
    listen [::]:80;

    location / {
        proxy_pass http://quicksmart_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 75s;   # gli stream SSE mandano heartbeat ogni 15s
        proxy_send_timeout 75s;
        proxy_buffering off;      # indispensabile per SSE
    }

    # asset statici Next.js con hash immutabile
    location /_next/static/ {
        proxy_pass http://quicksmart_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_valid 200 365d;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    client_max_body_size 5m;
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
}
